name: Video Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - input_movies.json

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        pip install requests

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install curl
      run: sudo apt-get install -y curl

    - name: Run Python script
      run: |
        python script.py

    # 🔍 Debug (see what files are created)
    - name: Debug files
      run: |
        echo "==== FILE STRUCTURE ===="
        ls -R

    # 🔥 Safe commit (no error if files missing)
    - name: Commit and Push Changes
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
    
        # Stage all changes
        git add .
    
        # Commit only if there are changes
        git diff --cached --quiet || git commit -m "Auto update movies"
    
        # Fetch latest remote changes
        git fetch origin main
    
        # Rebase local commit on top of remote main
        git pull --rebase origin main
    
        # Push updated branch
        git push origin main
