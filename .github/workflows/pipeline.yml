name: Video Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - input_movies.json

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        pip install requests

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install curl
      run: sudo apt-get install -y curl

    - name: Run Python script
      run: |
        python script.py

    # 🔍 Debug (see what files are created)
    - name: Debug files
      run: |
        echo "==== FILE STRUCTURE ===="
        ls -R

    # 🔥 Safe commit (no error if files missing)
    - name: Commit and Push Movies Only
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
    
        # Stage ONLY the files you want to commit
        git add movies.json
        git add movies/
    
        # If nothing changed, stop here
        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi
    
        # Stash staged changes temporarily
        git stash push --keep-index -m "movies-update"
    
        # Get latest remote changes
        git fetch origin main
        git pull --rebase origin main
    
        # Restore stashed changes
        git stash pop || true
    
        # Re-stage only target files
        git add movies.json
        git add movies/
    
        # Commit and push
        git commit -m "Auto update movies"
        git push origin main
