<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  .video-wrap { width: 100%; height: 100%; position: relative; }
  video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }

  /* Play button overlay */
  #play-overlay {
    position: absolute; inset: 0; z-index: 25;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #play-overlay.hidden { display: none; }
  .play-btn-circle {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(108,99,255,0.85);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, background 0.15s;
    box-shadow: 0 0 0 12px rgba(108,99,255,0.18);
  }
  #play-overlay:hover .play-btn-circle { background: #6c63ff; transform: scale(1.08); }
  .play-icon {
    width: 0; height: 0; border-style: solid;
    border-width: 14px 0 14px 26px;
    border-color: transparent transparent transparent #fff;
    margin-left: 6px;
  }

  /* Buffering overlay */
  #buf-overlay {
    position: absolute; inset: 0; z-index: 30;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85); gap: 16px;
  }
  #buf-overlay.visible { display: flex; }

  .buf-spinner {
    width: 46px; height: 46px;
    border: 3px solid rgba(108,99,255,0.2);
    border-top-color: #6c63ff;
    border-radius: 50%;
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .buf-label {
    color: #e8e8f0; font-size: 13px; font-weight: 500;
    font-family: 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.3px;
  }
  .buf-bar-wrap {
    width: 180px; height: 4px; background: rgba(255,255,255,0.1);
    border-radius: 4px; overflow: hidden;
  }
  .buf-bar {
    height: 100%; width: 0%; background: #6c63ff;
    border-radius: 4px; transition: width 0.2s ease;
  }

  /* Error overlay */
  #err-overlay {
    position: absolute; inset: 0; z-index: 35;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.9); gap: 12px;
  }
  #err-overlay.visible { display: flex; }
  .err-icon { font-size: 40px; }
  .err-msg {
    color: #f87171; font-size: 13px; font-weight: 500;
    font-family: 'Segoe UI', system-ui, sans-serif;
    text-align: center; max-width: 260px; line-height: 1.5;
  }
  .err-retry {
    background: #6c63ff; color: #fff; border: none;
    border-radius: 7px; padding: 8px 20px; font-size: 13px;
    font-weight: 600; cursor: pointer; font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .err-retry:hover { background: #5a52d5; }

  /* Track panel */
  .track-panel-overlay {
    position: absolute; top: 10px; right: 10px; z-index: 20;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
  }
  .track-toggle-row { display: flex; gap: 6px; }
  .tp-toggle-btn {
    background: rgba(10,10,15,0.82); border: 1px solid rgba(108,99,255,0.5);
    color: #e8e8f0; border-radius: 7px; font-size: 11px; font-weight: 600;
    padding: 5px 10px; cursor: pointer; backdrop-filter: blur(6px);
    transition: background 0.15s, border-color 0.15s;
    display: flex; align-items: center; gap: 5px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .tp-toggle-btn:hover { background: rgba(108,99,255,0.3); border-color: #6c63ff; }
  .tp-dot { width: 5px; height: 5px; border-radius: 50%; background: #a78bfa; display: none; }
  .tp-dropdown {
    background: rgba(13,13,20,0.97); border: 1px solid #1f1f2e;
    border-radius: 10px; padding: 8px; display: none;
    flex-direction: column; gap: 4px; min-width: 160px;
    backdrop-filter: blur(8px); box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
  .tp-dropdown.open { display: flex; }
  .tp-dropdown-title {
    font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #6b6b8a;
    text-transform: uppercase; padding: 2px 4px 6px;
    border-bottom: 1px solid #1f1f2e; margin-bottom: 2px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .tp-item {
    background: transparent; border: none; color: #6b6b8a;
    font-size: 12px; padding: 6px 8px; border-radius: 6px;
    cursor: pointer; text-align: left; display: flex; align-items: center;
    gap: 7px; transition: background 0.12s, color 0.12s; white-space: nowrap;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .tp-item:hover { background: rgba(108,99,255,0.18); color: #e8e8f0; }
  .tp-item.active { background: #6c63ff; color: #fff; }
  .tp-item .tp-badge {
    font-size: 9px; background: rgba(255,255,255,0.15);
    border-radius: 3px; padding: 1px 5px; font-weight: 600; margin-left: auto;
  }
  .tp-item.active .tp-badge { background: rgba(255,255,255,0.25); }
</style>
</head>
<body>
<div class="video-wrap">
  <video id="video" playsinline preload="metadata"></video>

  <!-- Shown immediately on load -->
  <div id="play-overlay">
    <div class="play-btn-circle"><div class="play-icon"></div></div>
  </div>

  <!-- Shown after click while buffering -->
  <div id="buf-overlay">
    <div class="buf-spinner"></div>
    <div class="buf-label" id="buf-label">Buffering… 0%</div>
    <div class="buf-bar-wrap"><div class="buf-bar" id="buf-bar"></div></div>
  </div>

  <!-- Error screen -->
  <div id="err-overlay">
    <div class="err-icon">⚠️</div>
    <div class="err-msg" id="err-msg">Failed to load stream.</div>
    <button class="err-retry" onclick="retryLoad()">Retry</button>
  </div>

  <div class="track-panel-overlay">
    <div class="track-toggle-row">
      <button class="tp-toggle-btn" onclick="toggleDropdown('video-dd','audio-dd')">
        🎬 Video <span class="tp-dot" id="video-dot"></span>
      </button>
      <button class="tp-toggle-btn" onclick="toggleDropdown('audio-dd','video-dd')">
        🔊 Audio <span class="tp-dot" id="audio-dot"></span>
      </button>
    </div>
    <div class="tp-dropdown" id="video-dd">
      <div class="tp-dropdown-title">Video Quality</div>
      <div id="quality-list"><span style="color:#6b6b8a;font-size:12px;padding:4px 8px">Loading…</span></div>
    </div>
    <div class="tp-dropdown" id="audio-dd">
      <div class="tp-dropdown-title">Audio Language</div>
      <div id="audio-list"><span style="color:#6b6b8a;font-size:12px;padding:4px 8px">Loading…</span></div>
    </div>
  </div>
</div>

<script>
const video       = document.getElementById('video');
const playOverlay = document.getElementById('play-overlay');
const bufOverlay  = document.getElementById('buf-overlay');
const bufBar      = document.getElementById('buf-bar');
const bufLabel    = document.getElementById('buf-label');
const errOverlay  = document.getElementById('err-overlay');
const errMsg      = document.getElementById('err-msg');

const BUFFER_TARGET = 6; // seconds to buffer before starting playback
let player = null, abrActive = true, currentUrl = null;

shaka.polyfill.installAll();

function toggleDropdown(openId, closeId) {
  document.getElementById(closeId).classList.remove('open');
  document.getElementById(openId).classList.toggle('open');
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.track-panel-overlay')) {
    document.getElementById('video-dd').classList.remove('open');
    document.getElementById('audio-dd').classList.remove('open');
  }
});

async function initPlayer() {
  if (player) { await player.destroy(); player = null; }
  player = new shaka.Player(video);

  player.configure({
    streaming: {
      bufferingGoal: 60,
      rebufferingGoal: 2,
      retryParameters: {
        maxAttempts: 10,
        baseDelay: 1000,
        backoffFactor: 1.3,
        timeout: 40000
      },
    },
    abr: {
      enabled: true,
      defaultBandwidthEstimate: 500000, // start conservative to avoid thrashing
    },
    manifest: {
      dash: {
        ignoreMinBufferTime: true, // helps with isoff-main profile
      }
    }
  });

  player.addEventListener('error', (e) => {
    console.error('Shaka error', e.detail);
    bufOverlay.classList.remove('visible');
    errMsg.textContent = `Playback error (code ${e.detail?.code ?? '?'}). Check console for details.`;
    errOverlay.classList.add('visible');
  });
}

// FIX: correctly reads buffered end from first range
function getBuffered() {
  const buf = video.buffered;
  if (buf.length > 0) return buf.end(0);
  return 0;
}

// Wait until BUFFER_TARGET seconds buffered, updating progress bar
function waitForBuffer() {
  return new Promise(resolve => {
    function check() {
      const buffered = getBuffered();
      const pct = Math.min(100, (buffered / BUFFER_TARGET) * 100);
      bufBar.style.width = pct + '%';
      bufLabel.textContent = `Buffering… ${Math.round(pct)}%`;
      if (buffered >= BUFFER_TARGET) {
        resolve();
      } else {
        requestAnimationFrame(check);
      }
    }
    check();
  });
}

// Click play → buffer screen → wait 6s buffered → play
playOverlay.addEventListener('click', async () => {
  playOverlay.classList.add('hidden');
  bufOverlay.classList.add('visible');

  video.controls = false;
  try { await video.play(); } catch(_) {}
  video.pause();

  await waitForBuffer();

  bufOverlay.classList.remove('visible');
  video.controls = true;
  // FIX: removed video.currentTime = 0 — that was flushing the buffer
  // and forcing all init segments to be re-fetched, causing playback to stall
  video.play().catch(() => {});
});

async function loadVideo(url) {
  currentUrl = url;
  errOverlay.classList.remove('visible');
  video.controls = false;
  playOverlay.classList.remove('hidden');
  bufBar.style.width = '0%';
  bufLabel.textContent = 'Buffering… 0%';

  await initPlayer();

  try {
    await player.load(url);
    renderQualityTracks();
    renderAudioTracks();
  } catch (e) {
    console.error('Load error', e);
    playOverlay.classList.add('hidden');
    errMsg.textContent = `Failed to load stream (code ${e.code ?? '?'}). The URL may be invalid or expired.`;
    errOverlay.classList.add('visible');
  }
}

function retryLoad() {
  errOverlay.classList.remove('visible');
  if (currentUrl) loadVideo(currentUrl);
}

/* ---------- quality / audio tracks ---------- */

function formatBitrate(bps) {
  if (!bps) return '';
  return bps >= 1000000 ? (bps / 1000000).toFixed(1) + 'M' : Math.round(bps / 1000) + 'k';
}
function qualityLabel(t) {
  return t.height ? t.height + 'p' : t.width ? t.width + 'w' : 'Track ' + t.id;
}

function renderQualityTracks() {
  const container = document.getElementById('quality-list');
  container.innerHTML = '';
  abrActive = true;
  const tracks = player.getVariantTracks();
  const seen = new Map();
  for (const t of tracks) {
    const key = t.height || t.width || t.id;
    if (!seen.has(key) || t.bandwidth > seen.get(key).bandwidth) seen.set(key, t);
  }
  const unique = [...seen.values()].sort((a, b) => (b.height || 0) - (a.height || 0));
  if (!unique.length) {
    container.innerHTML = '<span style="color:#6b6b8a;font-size:12px;padding:4px 8px">No tracks</span>';
    return;
  }
  document.getElementById('video-dot').style.display = 'inline-block';

  const autoBtn = document.createElement('button');
  autoBtn.className = 'tp-item active';
  autoBtn.innerHTML = `Auto <span class="tp-badge" style="background:rgba(74,222,128,0.2);color:#4ade80">ABR</span>`;
  autoBtn.onclick = () => {
    abrActive = true;
    player.configure({ abr: { enabled: true } });
    container.querySelectorAll('.tp-item').forEach(b => b.classList.remove('active'));
    autoBtn.classList.add('active');
  };
  container.appendChild(autoBtn);

  unique.forEach(track => {
    const btn = document.createElement('button');
    const qlbl = qualityLabel(track);
    const blbl = formatBitrate(track.bandwidth);
    btn.className = 'tp-item';
    btn.innerHTML = `${qlbl}${blbl ? `<span class="tp-badge">${blbl}</span>` : ''}`;
    btn.onclick = () => {
      abrActive = false;
      player.configure({ abr: { enabled: false } });
      const match = player.getVariantTracks().find(t =>
        (t.height || t.width || t.id) === (track.height || track.width || track.id)
      );
      if (match) player.selectVariantTrack(match, true);
      container.querySelectorAll('.tp-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    container.appendChild(btn);
  });
}

const LANG_NAMES = {
  hi: 'Hindi', te: 'Telugu', en: 'English', ta: 'Tamil',
  ka: 'Kannada', ml: 'Malayalam', mr: 'Marathi', bn: 'Bengali', und: 'Default'
};
function langLabel(lang, title) {
  if (title && title !== lang) return title;
  return LANG_NAMES[lang?.toLowerCase()] || lang?.toUpperCase() || 'Track';
}

function renderAudioTracks() {
  const container = document.getElementById('audio-list');
  container.innerHTML = '';
  const tracks = player.getVariantTracks();
  const seen = new Set();
  const langs = [];
  for (const t of tracks) {
    const key = t.language || 'und';
    if (!seen.has(key)) { seen.add(key); langs.push({ language: key, label: t.label || '' }); }
  }
  if (!langs.length) {
    container.innerHTML = '<span style="color:#6b6b8a;font-size:12px;padding:4px 8px">No tracks</span>';
    return;
  }
  document.getElementById('audio-dot').style.display = 'inline-block';

  const active = tracks.find(t => t.active);
  const activeLang = active?.language || langs[0].language;

  langs.forEach(({ language, label }) => {
    const btn = document.createElement('button');
    btn.className = 'tp-item' + (language === activeLang ? ' active' : '');
    btn.textContent = langLabel(language, label);
    btn.onclick = () => {
      document.querySelectorAll('#audio-list .tp-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      player.selectAudioLanguage(language);
    };
    container.appendChild(btn);
  });
}

const params = new URLSearchParams(window.location.search);
const autoUrl = params.get('url');
if (autoUrl) loadVideo(autoUrl.trim());
</script>
</body>
</html>
