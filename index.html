<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
.wrap{width:100%;height:100%;position:relative;background:#000;cursor:none}
.wrap.show-cursor{cursor:default}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
video::-webkit-media-controls{display:none!important}
.spinner-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;pointer-events:none}
.ring{width:42px;height:42px;border:2.5px solid rgba(255,255,255,0.15);border-top-color:rgba(255,255,255,0.9);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(0,0,0,0.72);color:#fff;font-size:12px;padding:5px 16px;border-radius:30px;pointer-events:none;opacity:0;transition:opacity .35s;white-space:nowrap}
.toast.on{opacity:1}
.controls{position:absolute;bottom:0;left:0;right:0;z-index:40;padding:0 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,0.75) 60%);opacity:0;transition:opacity .3s}
.wrap.show-cursor .controls{opacity:1}
.prog-wrap{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;margin-bottom:6px}
.prog-track{width:100%;height:3px;background:rgba(255,255,255,0.2);border-radius:2px;position:relative;transition:height .15s}
.prog-wrap:hover .prog-track{height:5px}
.prog-buf{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,0.3);border-radius:2px;pointer-events:none}
.prog-fill{position:absolute;left:0;top:0;height:100%;background:#fff;border-radius:2px;pointer-events:none}
.prog-thumb{position:absolute;top:50%;width:13px;height:13px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .15s}
.prog-wrap:hover .prog-thumb{opacity:1}
.bottom-row{display:flex;align-items:center;gap:10px}
.btn{background:none;border:none;color:#fff;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;opacity:.9;transition:opacity .15s;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.btn:hover{opacity:1}
.btn svg{display:block}
.time{color:rgba(255,255,255,0.85);font-size:12px;white-space:nowrap;margin-right:2px}
.spacer{flex:1}
.vol-wrap{display:flex;align-items:center;gap:6px}
.vol-slider{-webkit-appearance:none;appearance:none;width:64px;height:3px;background:rgba(255,255,255,0.25);border-radius:2px;outline:none;cursor:pointer}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer}
.vol-slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:none;cursor:pointer}
.pill-btn{background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:11px;padding:4px 9px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:4px;-webkit-tap-highlight-color:transparent;white-space:nowrap;transition:background .15s}
.pill-btn:hover{background:rgba(255,255,255,0.22)}
.pill-btn svg{flex-shrink:0}
.panel{position:absolute;bottom:58px;right:14px;z-index:50;background:rgba(16,16,16,0.95);border-radius:10px;overflow:hidden;min-width:160px;transform:translateY(6px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.panel.open{opacity:1;transform:translateY(0);pointer-events:all}
.panel-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:#ddd;font-size:12px;text-align:left;padding:10px 14px;cursor:pointer;transition:background .12s;white-space:nowrap}
.panel-item:hover{background:rgba(255,255,255,0.08)}
.panel-item.active{color:#fff;font-weight:600}
.panel-item.active .dot{opacity:1}
.dot{width:6px;height:6px;border-radius:50%;background:#4fc3f7;flex-shrink:0;opacity:0;transition:opacity .15s}
.panel-label{font-size:10px;color:rgba(255,255,255,0.4);padding:7px 14px 3px;text-transform:uppercase;letter-spacing:.06em}
.net-badge{position:absolute;top:14px;right:14px;z-index:45;background:rgba(0,0,0,0.6);color:#fff;font-size:11px;padding:4px 10px;border-radius:20px;pointer-events:none;display:flex;align-items:center;gap:5px;opacity:0;transition:opacity .4s}
.ndot{width:7px;height:7px;border-radius:50%;background:#888;flex-shrink:0;transition:background .5s}
.ndot.g{background:#4caf50}.ndot.y{background:#ff9800}.ndot.r{background:#f44336}
.err{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);font-size:14px;gap:10px;z-index:60}
.err svg{opacity:.5}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <video id="v" playsinline></video>
  <div class="spinner-wrap"><div class="ring" id="ring" style="display:none"></div></div>
  <div class="toast" id="toast"></div>
  <div class="net-badge" id="netBadge"><div class="ndot" id="ndot"></div><span id="netLbl"></span></div>
  <div class="err" id="errBox">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="errMsg">Unable to load video</span>
  </div>
  <div class="controls" id="controls">
    <div class="prog-wrap" id="progWrap">
      <div class="prog-track">
        <div class="prog-buf" id="progBuf"></div>
        <div class="prog-fill" id="progFill"></div>
        <div class="prog-thumb" id="progThumb"></div>
      </div>
    </div>
    <div class="bottom-row">
      <button class="btn" id="btnPlay" aria-label="Play/Pause">
        <svg id="icPlay" width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icPause" width="22" height="22" viewBox="0 0 24 24" fill="white" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <div class="vol-wrap">
        <button class="btn" id="btnMute" aria-label="Mute">
          <svg id="icVol" width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          <svg id="icMute" width="18" height="18" viewBox="0 0 24 24" fill="white" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.02" value="1">
      </div>
      <span class="time" id="timeDisp">0:00 / 0:00</span>
      <div class="spacer"></div>
      <button class="pill-btn" id="audioBtn" style="display:none" aria-label="Audio track">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <span id="audioBtnLbl">Audio</span>
      </button>
      <button class="btn" id="btnFs" aria-label="Fullscreen">
        <svg id="icFs" width="19" height="19" viewBox="0 0 24 24" fill="white"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <svg id="icExit" width="19" height="19" viewBox="0 0 24 24" fill="white" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
      </button>
    </div>
  </div>
  <div class="panel" id="audioPanel">
    <div class="panel-label">Audio Track</div>
    <div id="audioList"></div>
  </div>
</div>
<script>
// ── READ MPD URL FROM ?src= PARAM ──
const params = new URLSearchParams(location.search);
const MPD = params.get("src") || "";

const wrap        = document.getElementById("wrap");
const v           = document.getElementById("v");
const ring        = document.getElementById("ring");
const toast       = document.getElementById("toast");
const netBadge    = document.getElementById("netBadge");
const ndot        = document.getElementById("ndot");
const netLbl      = document.getElementById("netLbl");
const progWrap    = document.getElementById("progWrap");
const progBuf     = document.getElementById("progBuf");
const progFill    = document.getElementById("progFill");
const progThumb   = document.getElementById("progThumb");
const btnPlay     = document.getElementById("btnPlay");
const icPlay      = document.getElementById("icPlay");
const icPause     = document.getElementById("icPause");
const btnMute     = document.getElementById("btnMute");
const icVol       = document.getElementById("icVol");
const icMute      = document.getElementById("icMute");
const volSlider   = document.getElementById("volSlider");
const timeDisp    = document.getElementById("timeDisp");
const audioBtn    = document.getElementById("audioBtn");
const audioBtnLbl = document.getElementById("audioBtnLbl");
const audioPanel  = document.getElementById("audioPanel");
const audioList   = document.getElementById("audioList");
const btnFs       = document.getElementById("btnFs");
const icFs        = document.getElementById("icFs");
const icExit      = document.getElementById("icExit");
const errBox      = document.getElementById("errBox");
const errMsg      = document.getElementById("errMsg");

// storage keys unique per URL
const POS_KEY   = "sp_pos_"  + btoa(MPD).slice(0,14);
const AUDIO_KEY = "sp_aud_"  + btoa(MPD).slice(0,14);

// ── TOAST ──
let toastT;
function showToast(msg,dur=1800){
  clearTimeout(toastT);toast.textContent=msg;toast.classList.add("on");
  toastT=setTimeout(()=>toast.classList.remove("on"),dur);
}

// ── LANG MAP ──
const LANG={en:"English",hi:"Hindi",ta:"Tamil",te:"Telugu",ml:"Malayalam",kn:"Kannada",mr:"Marathi",bn:"Bengali",gu:"Gujarati",pa:"Punjabi",ur:"Urdu",fr:"French",de:"German",es:"Spanish",it:"Italian",pt:"Portuguese",ru:"Russian",zh:"Chinese",ja:"Japanese",ko:"Korean",ar:"Arabic",tr:"Turkish",nl:"Dutch",pl:"Polish",sv:"Swedish"};
function langName(c){if(!c||c==="und")return null;return LANG[c.split("-")[0].toLowerCase()]||c.toUpperCase()}

// ── NO URL ERROR ──
if(!MPD){
  errMsg.textContent="No video URL provided";
  errBox.style.display="flex";
}

// ── SHAKA INIT ──
shaka.polyfill.installAll();
const player = new shaka.Player();

async function initPlayer(){
  if(!MPD) return;
  await player.attach(v);
  player.configure({
    streaming:{
      bufferingGoal:20,
      rebufferingGoal:2,
      bufferBehind:30,
      // ── 5 PARALLEL CHUNK DOWNLOADS ──
      segmentPrefetchLimit: 5,
      // Parallel fetch for both video and audio segments
      maxDisabledTime: 30,
      retryParameters:{
        maxAttempts:4,
        baseDelay:1000,
        backoffFactor:2,
        // Allow up to 5 concurrent fetch attempts
        timeout: 0,
        stallTimeout: 5000,
        connectionTimeout: 10000,
      },
    },
    // Parallel manifest and segment fetching
    manifest:{
      retryParameters:{
        maxAttempts:4,
        baseDelay:1000,
        backoffFactor:2,
        timeout: 0,
        stallTimeout: 5000,
        connectionTimeout: 10000,
      },
    },
    abr:{enabled:true,defaultBandwidthEstimate:1000000},
  });

  // ── PARALLEL FETCH NETWORKINGENGINE PLUGIN ──
  // Override segment requests to dispatch up to 5 in parallel via a queue
  const ne = player.getNetworkingEngine();
  const PARALLEL = 5;
  let activeRequests = 0;
  const queue = [];

  function drainQueue() {
    while (queue.length > 0 && activeRequests < PARALLEL) {
      const { resolve } = queue.shift();
      activeRequests++;
      resolve();
    }
  }

  ne.registerRequestFilter((type, request) => {
    // Apply parallel limiting to segment requests (type 1 = SEGMENT)
    if (type !== shaka.net.NetworkingEngine.RequestType.SEGMENT) return;
    if (activeRequests < PARALLEL) {
      activeRequests++;
      return; // proceed immediately
    }
    // Queue the request until a slot opens
    return new Promise(resolve => {
      queue.push({ resolve });
    });
  });

  ne.registerResponseFilter((type, response) => {
    if (type !== shaka.net.NetworkingEngine.RequestType.SEGMENT) return;
    activeRequests = Math.max(0, activeRequests - 1);
    drainQueue();
  });

  player.addEventListener("error",e=>{
    console.error(e.detail);
    ring.style.display="none";
    errMsg.textContent="Playback error — "+( e.detail?.code||"unknown");
    errBox.style.display="flex";
  });
  player.addEventListener("buffering",e=>{ring.style.display=e.buffering?"block":"none"});
  player.addEventListener("trackschanged",setupAudioTracks);
  player.addEventListener("adaptation",()=>{
    const t=player.getVariantTracks().find(t=>t.active);
    if(t&&t.height) showToast(t.height+"p · "+Math.round(t.bandwidth/1000)+"kbps",1400);
  });
  try{
    ring.style.display="block";
    await player.load(MPD);
    ring.style.display="none";
    const saved=parseFloat(localStorage.getItem(POS_KEY));
    if(saved&&saved>2){v.currentTime=saved;showToast("Resumed from "+fmtTime(saved),2500)}
    v.play().catch(()=>{});
    setupAudioTracks();
    checkNetwork();
  }catch(e){
    console.error(e);ring.style.display="none";
    errMsg.textContent="Failed to load stream";
    errBox.style.display="flex";
  }
}
initPlayer();

// ── TIME ──
function fmtTime(s){
  s=Math.floor(s||0);
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return h>0?h+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"):m+":"+String(sec).padStart(2,"0");
}

// ── PROGRESS ──
function updateProgress(){
  if(!v.duration)return;
  const pct=v.currentTime/v.duration*100;
  progFill.style.width=pct+"%";
  progThumb.style.left=pct+"%";
  let bufEnd=0;
  for(let i=0;i<v.buffered.length;i++) if(v.buffered.start(i)<=v.currentTime) bufEnd=Math.max(bufEnd,v.buffered.end(i));
  progBuf.style.width=(bufEnd/v.duration*100)+"%";
  timeDisp.textContent=fmtTime(v.currentTime)+" / "+fmtTime(v.duration);
}
setInterval(updateProgress,300);

let seeking=false;
function seekTo(e){
  const r=progWrap.getBoundingClientRect();
  v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*v.duration;
}
progWrap.addEventListener("mousedown",e=>{seeking=true;seekTo(e)});
progWrap.addEventListener("touchstart",e=>{seeking=true;seekTo(e.touches[0])},{passive:true});
document.addEventListener("mousemove",e=>{if(seeking)seekTo(e)});
document.addEventListener("mouseup",()=>seeking=false);
document.addEventListener("touchend",()=>seeking=false);

// ── PLAY / PAUSE ──
function syncPlay(){icPlay.style.display=v.paused?"block":"none";icPause.style.display=v.paused?"none":"block"}
btnPlay.addEventListener("click",()=>{v.paused?v.play():v.pause()});
v.addEventListener("click",()=>{v.paused?v.play():v.pause()});
v.addEventListener("play",syncPlay);v.addEventListener("pause",syncPlay);

// ── VOLUME ──
volSlider.addEventListener("input",()=>{v.volume=+volSlider.value;v.muted=v.volume===0;syncMute()});
btnMute.addEventListener("click",()=>{v.muted=!v.muted;if(!v.muted&&v.volume===0)v.volume=0.5;volSlider.value=v.muted?0:v.volume;syncMute()});
function syncMute(){icVol.style.display=(v.muted||v.volume===0)?"none":"block";icMute.style.display=(v.muted||v.volume===0)?"block":"none"}

// ── FULLSCREEN ──
btnFs.addEventListener("click",()=>{document.fullscreenElement?document.exitFullscreen():wrap.requestFullscreen().catch(()=>{})});
document.addEventListener("fullscreenchange",()=>{const f=!!document.fullscreenElement;icFs.style.display=f?"none":"block";icExit.style.display=f?"block":"none"});

// ── CURSOR / HIDE CONTROLS ──
let hideT;
function showControls(){wrap.classList.add("show-cursor");clearTimeout(hideT);hideT=setTimeout(()=>{if(!v.paused)wrap.classList.remove("show-cursor")},3000)}
wrap.addEventListener("mousemove",showControls);
wrap.addEventListener("touchstart",showControls,{passive:true});
v.addEventListener("pause",()=>wrap.classList.add("show-cursor"));
v.addEventListener("play",showControls);

// ── SAVE POSITION ──
function savePos(){const t=v.currentTime;if(t>2)localStorage.setItem(POS_KEY,t)}
setInterval(savePos,5000);v.addEventListener("pause",savePos);
v.addEventListener("ended",()=>localStorage.removeItem(POS_KEY));

// ── AUDIO TRACKS ──
function setupAudioTracks(){
  const variants=player.getVariantTracks();
  const langs=[...new Set(variants.map(t=>t.language).filter(Boolean))];
  audioList.innerHTML="";
  if(langs.length<=1){audioBtn.style.display="none";return}
  audioBtn.style.display="flex";
  const savedLang=localStorage.getItem(AUDIO_KEY)||langs[0];
  langs.forEach(lang=>{
    const name=langName(lang)||lang.toUpperCase();
    const active=lang===savedLang;
    const btn=document.createElement("button");
    btn.className="panel-item"+(active?" active":"");
    btn.innerHTML=`<span class="dot"></span>${name}`;
    btn.addEventListener("click",()=>{
      player.selectAudioLanguage(lang);
      localStorage.setItem(AUDIO_KEY,lang);
      document.querySelectorAll(".panel-item").forEach((b,j)=>b.classList.toggle("active",langs[j]===lang));
      audioBtnLbl.textContent=name;showToast(name);closePanel();
    });
    audioList.appendChild(btn);
    if(active){audioBtnLbl.textContent=name;if(lang!==langs[0])player.selectAudioLanguage(lang)}
  });
}

// ── PANEL ──
let panelOpen=false;
function openPanel(){panelOpen=true;audioPanel.classList.add("open")}
function closePanel(){panelOpen=false;audioPanel.classList.remove("open")}
audioBtn.addEventListener("click",e=>{e.stopPropagation();panelOpen?closePanel():openPanel()});
document.addEventListener("click",()=>closePanel());
audioPanel.addEventListener("click",e=>e.stopPropagation());

// ── NETWORK CHECK ──
async function checkNetwork(){
  if(!MPD)return;
  try{
    const t0=performance.now();
    const r=await fetch(MPD+"?nc="+Date.now(),{cache:"no-store",signal:AbortSignal.timeout(7000)});
    const buf=await r.arrayBuffer();
    const mbps=((buf.byteLength*8)/((performance.now()-t0)/1000))/1e6;
    const m=Math.round(mbps*10)/10;
    netBadge.style.opacity="1";
    netLbl.textContent=m.toFixed(1)+" Mbps";
    ndot.className="ndot "+(m>=5?"g":m>=1.5?"y":"r");
    setTimeout(()=>netBadge.style.opacity="0",5000);
    player.configure("streaming.bufferingGoal",m>=5?10:m>=2?20:35);
  }catch(e){}
}
setTimeout(checkNetwork,1200);
setInterval(checkNetwork,60000);
</script>
</body>
</html>
