function isCDNResolverURL(uri) {
    try {
        const origin = new URL(uri).origin;
        return CDN_WORKERS.some(worker => new URL(worker).origin === origin);
    } catch {
        return false;
    }
}





function isProxyURL(uri) {
    try {
        const origin = new URL(uri).origin;
        return DOWNLOAD_PROXIES.some(proxy => new URL(proxy).origin === origin);
    } catch {
        return false;
    }
}





function isDiscordCDNURL(uri) {



    try {



        const host =

            new URL(uri).hostname;



        return (

            host === "cdn.discordapp.com" ||

            host === "media.discordapp.net"

        );



    } catch {



        return false;

    }

}





/* =========================================================

   RESOLVE CDN URL

   ========================================================= */



async function resolveDiscordUrl(

    resolverUrl

) {



    log(

        "[RESOLVING CDN]",

        resolverUrl

    );



    const originalUrl = new URL(resolverUrl);
    const workerUrl = new URL(nextCDNWorker());
    const workerPath = workerUrl.pathname.replace(/\/+$/, "");
    const requestUrl = new URL(
        `${workerPath}${originalUrl.pathname}${originalUrl.search}`,
        workerUrl.origin
    );
    const response = await fetch(requestUrl, { method: "GET" });



    if (!response.ok) {



        throw new Error(

            "CDN resolver failed: " +

            response.status

        );

    }



    const data =

        await response.json();



    log(

        "[CDN RESOLVED]",

        data

    );



    if (!data.url) {



        throw new Error(

            "CDN resolver did not return url"

        );

    }



    return data.url;

}

                    ];

                return;

            }





            /* ---------------------------------------------
               OTHER REQUESTS
               --------------------------------------------- */



            const original =

                request.uris[0];



            if (

                isCDNResolverURL(

                    original

                ) ||

                isDiscordCDNURL(

                    original

                )

            ) {



                request.uris = [

                    await transformRequestURL(

                        original

                    )

                ];

            }

        }

    );





    /* -----------------------------------------------------
       RESPONSE FILTER
       ----------------------------------------------------- */



    net.registerResponseFilter(

        (type, response) => {



            if (

                type ===

                shaka.net.NetworkingEngine

                    .RequestType.LICENSE

            ) {



                log(

                    "[DRM LICENSE RESPONSE]",

                    {

                        status:

                            response.status,



                        uri:

                            response.uri,



                        contentType:

                            response.headers

                                ? response.headers[

                                    "content-type"

                                ]

                                : undefined,



                        bytes:

                            response.data

                                ? response.data.byteLength

                                : 0

                    }

                );



                return;

            }





            if (

                type ===

                shaka.net.NetworkingEngine

                    .RequestType.SEGMENT

            ) {



                log(

                    "[SEGMENT RESPONSE]",

                    {

                        status:

                            response.status,



                        uri:

                            response.uri,



                        contentType:

                            response.headers

                                ? response.headers[

                                    "content-type"

                                ]

                                : undefined,



                        bytes:

                            response.data

                                ? response.data.byteLength

                                : 0

                    }

                );

            }

        }

    );

}





/* =========================================================

   DRM CONFIG

   ========================================================= */



function configureDRM() {

    player.configure({

        streaming: {
            bufferingGoal: 30,
            rebufferingGoal: 2,
            bufferBehind: 30
        },



        drm: {



            servers: {



                "org.w3.clearkey":

                    DRM_LICENSE_URL

            },



            retryParameters: {



                maxAttempts: 3,



                baseDelay: 500,



                backoffFactor: 2,



                fuzzFactor: 0.5,



                timeout: 15000

            },



            preferredKeySystems: [

                "org.w3.clearkey"

            ],



            delayLicenseRequestUntilPlayed:

                false

        }

    });





    drmLog(

        "[DRM CONFIG]",

        {

            keySystem:

                "org.w3.clearkey",



            licenseUrl:

                DRM_LICENSE_URL,



        }

    );

}





/* =========================================================

   MPD PREFLIGHT

   ========================================================= */



async function preflightMPD(url) {



    log(

        "[MPD PREFLIGHT]",

        url

    );



    try {



        const response =

            await fetch(url);



        log(

            "[MPD PREFLIGHT RESPONSE]",

            {

                status:

                    response.status,



                contentType:

                    response.headers.get(

                        "content-type"

                    ),



                bytes:

                    response.headers.get(

                        "content-length"

                    )

            }

        );



        if (!response.ok) {



            throw new Error(

                "MPD returned HTTP " +

                response.status

            );

        }



        const text =

            await response.text();



        log(

            "[MPD SIZE]",

            text.length

        );





        /* Show DRM-related MPD lines */



        const drmLines =

            text

                .split(/\r?\n/)

                .filter(line =>

                    line.includes(

                        "ContentProtection"

                    ) ||

                    line.includes(

                        "default_KID"

                    ) ||

                    line.includes(

                        "ClearKey"

                    )

                );



        drmLog(

            "[MPD DRM SIGNALING]",

            drmLines

        );





        /* Check KID */



        const kidMatches =

            [

                ...text.matchAll(

                    /default_KID\s*=\s*"([^"]+)"/gi

                )

            ];



        if (kidMatches.length) {



            drmLog(

                "[MPD DEFAULT KID]",

                kidMatches.map(

                    x => x[1]

                )

            );

        }



    } catch (error) {



        log(

            "[MPD PREFLIGHT ERROR]",

            error

        );

    }

}





/* =========================================================

   LOAD VIDEO

   ========================================================= */



async function loadVideo(

    url

) {



    if (!player) {



        log(

            "[ERROR] Player not initialized"

        );



        return;

    }





    MPD_URL =

        url.trim();





    if (!MPD_URL) {
        setStatus("Add an MPD URL as ?url=... in the page address.", "bad");
        return;

    }





    setStatus(

        "Loading MPD..."

    );





    log(

        "===================================="

    );



    log(

        "[LOAD VIDEO]",

        MPD_URL

    );





    await preflightMPD(

        MPD_URL

    );





    try {
        await player.unload();
    } catch (error) {
        log("[UNLOAD ERROR]", error);
    }





    try {



        await player.load(
            MPD_URL
        );

        log(

            "[MPD LOADED]"

        );





        const variants =

            player.getVariantTracks();





        log(

            "[VARIANT TRACKS]",

            variants

        );





        let keySystem =

            "unknown";



        try {



            keySystem =

                player.getKeySystem();



        } catch {}





        drmLog(

            "[DRM KEY SYSTEM]",

            keySystem || "not active yet"

        );





        setStatus(

            "MPD loaded. Attempting playback...",

            "good"

        );





        /*
         * Do not wait indefinitely for automatic playback.
         * The user can press Play.
         */



        try {



            await video.play();



            log(

                "[VIDEO] play() succeeded"

            );



        } catch (error) {



            log(

                "[VIDEO] autoplay/play blocked",

                error.message

            );

        }



    } catch (error) {



        setStatus(

            "MPD/DRM load failed",

            "bad"

        );



        log(

            "[LOAD ERROR]",

            error

        );



        drmLog(

            "[LOAD ERROR]",

            {

                code:

                    error.code,



                category:

                    error.category,



                severity:

                    error.severity,



                data:

                    error.data

            }

        );

    }

}

/* =========================================================

   INITIALIZE

   ========================================================= */



async function init() {



    shaka.polyfill.installAll();





    if (

        !shaka.Player.isBrowserSupported()

    ) {



        setStatus(

            "Browser is not supported by Shaka",

            "bad"

        );



        return;

    }





    video =
        playerRoot.querySelector(".player-video");





    player = new shaka.Player();
    await player.attach(video);
    ui = new shaka.ui.Overlay(
        player,
        video.parentElement,
        video
    );
    ui.configure({
        controlPanelElements: [
            "play_pause",
            "time_and_duration",
            "language",
            "quality",
            "spacer",
            "mute",
            "volume",
            "fullscreen"
        ]
    });





    /*
     * Configure DRM BEFORE loading MPD.
     */



    configureDRM();





    /*
     * Install diagnostics.
     */



    installDrmDiagnostics();



    installRequestFilter();



    installVideoDiagnostics();

    log(

        "%c[PLAYER READY]",

        "color:#00ff00;font-weight:bold"

    );





    log(

        "[SHAKA VERSION]",

        SHAKA_VERSION

    );





    log(

        "[LICENSE URL]",

        DRM_LICENSE_URL

    );





    setStatus(
        "Player ready. Add an MPD URL as ?url=... in the page address."
    );
}



/* =========================================================

   START

   ========================================================= */



const initialMpdUrl =
    new URLSearchParams(window.location.search).get("url");

if (initialMpdUrl) {
    init().then(() => loadVideo(initialMpdUrl)).catch(error => {
        setStatus("Player initialization failed.", "bad");
    });
} else {
init().catch(error => {
setStatus("Player initialization failed.", "bad");
});
}



})();
