<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  .video-wrap { width: 100%; height: 100%; position: relative; }
  video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }

  #play-overlay {
    position: absolute; inset: 0; z-index: 25;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #play-overlay.hidden { display: none; }
  .play-btn-circle {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(108,99,255,0.85);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, background 0.15s;
    box-shadow: 0 0 0 12px rgba(108,99,255,0.18);
  }
  #play-overlay:hover .play-btn-circle { background: #6c63ff; transform: scale(1.08); }
  .play-icon {
    width: 0; height: 0; border-style: solid;
    border-width: 14px 0 14px 26px;
    border-color: transparent transparent transparent #fff;
    margin-left: 6px;
  }

  #buf-overlay {
    position: absolute; inset: 0; z-index: 30;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85); gap: 16px;
  }
  #buf-overlay.visible { display: flex; }
  .buf-spinner {
    width: 46px; height: 46px;
    border: 3px solid rgba(108,99,255,0.2);
    border-top-color: #6c63ff;
    border-radius: 50%;
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .buf-label {
    color: #e8e8f0; font-size: 13px; font-weight: 500;
    font-family: 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.3px;
  }
  .buf-bar-wrap {
    width: 180px; height: 4px; background: rgba(255,255,255,0.1);
    border-radius: 4px; overflow: hidden;
  }
  .buf-bar {
    height: 100%; width: 0%; background: #6c63ff;
    border-radius: 4px; transition: width 0.3s ease;
  }
  /* FIX: timeout sub-label */
  .buf-sublabel {
    color: #6b6b8a; font-size: 11px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  #err-overlay {
    position: absolute; inset: 0; z-index: 35;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.9); gap: 12px;
  }
  #err-overlay.visible { display: flex; }
  .err-icon { font-size: 40px; }
  .err-msg {
    color: #f87171; font-size: 13px; font-weight: 500;
    font-family: 'Segoe UI', system-ui, sans-serif;
    text-align: center; max-width: 280px; line-height: 1.5;
  }
  /* FIX: error detail sub-text */
  .err-detail {
    color: #6b6b8a; font-size: 11px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    text-align: center; max-width: 280px; line-height: 1.5;
  }
  .err-retry {
    background: #6c63ff; color: #fff; border: none;
    border-radius: 7px; padding: 8px 20px; font-size: 13px;
    font-weight: 600; cursor: pointer; font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .err-retry:hover { background: #5a52d5; }

  .track-panel-overlay {
    position: absolute; top: 10px; right: 10px; z-index: 20;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
  }
  .track-toggle-row { display: flex; gap: 6px; }
  .tp-toggle-btn {
    background: rgba(10,10,15,0.82); border: 1px solid rgba(108,99,255,0.5);
    color: #e8e8f0; border-radius: 7px; font-size: 11px; font-weight: 600;
    padding: 5px 10px; cursor: pointer; backdrop-filter: blur(6px);
    transition: background 0.15s, border-color 0.15s;
    display: flex; align-items: center; gap: 5px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .tp-toggle-btn:hover { background: rgba(108,99,255,0.3); border-color: #6c63ff; }
  .tp-dot { width: 5px; height: 5px; border-radius: 50%; background: #a78bfa; display: none; }
  .tp-dropdown {
    background: rgba(13,13,20,0.97); border: 1px solid #1f1f2e;
    border-radius: 10px; padding: 8px; display: none;
    flex-direction: column; gap: 4px; min-width: 160px;
    backdrop-filter: blur(8px); box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
  .tp-dropdown.open { display: flex; }
  .tp-dropdown-title {
    font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #6b6b8a;
    text-transform: uppercase; padding: 2px 4px 6px;
    border-bottom: 1px solid #1f1f2e; margin-bottom: 2px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .tp-item {
    background: transparent; border: none; color: #6b6b8a;
    font-size: 12px; padding: 6px 8px; border-radius: 6px;
    cursor: pointer; text-align: left; display: flex; align-items: center;
    gap: 7px; transition: background 0.12s, color 0.12s; white-space: nowrap;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .tp-item:hover { background: rgba(108,99,255,0.18); color: #e8e8f0; }
  .tp-item.active { background: #6c63ff; color: #fff; }
  .tp-item .tp-badge {
    font-size: 9px; background: rgba(255,255,255,0.15);
    border-radius: 3px; padding: 1px 5px; font-weight: 600; margin-left: auto;
  }
  .tp-item.active .tp-badge { background: rgba(255,255,255,0.25); }
</style>
</head>
<body>
<div class="video-wrap">
  <video id="video" playsinline preload="auto"></video>

  <div id="play-overlay">
    <div class="play-btn-circle"><div class="play-icon"></div></div>
  </div>

  <div id="buf-overlay">
    <div class="buf-spinner"></div>
    <div class="buf-label" id="buf-label">Loading… 0%</div>
    <div class="buf-bar-wrap"><div class="buf-bar" id="buf-bar"></div></div>
    <div class="buf-sublabel" id="buf-sublabel"></div>
  </div>

  <div id="err-overlay">
    <div class="err-icon">⚠️</div>
    <div class="err-msg" id="err-msg">Failed to load stream.</div>
    <div class="err-detail" id="err-detail"></div>
    <button class="err-retry" onclick="retryLoad()">Retry</button>
  </div>

  <div class="track-panel-overlay">
    <div class="track-toggle-row">
      <button class="tp-toggle-btn" onclick="toggleDropdown('video-dd','audio-dd')">
        🎬 Video <span class="tp-dot" id="video-dot"></span>
      </button>
      <button class="tp-toggle-btn" onclick="toggleDropdown('audio-dd','video-dd')">
        🔊 Audio <span class="tp-dot" id="audio-dot"></span>
      </button>
    </div>
    <div class="tp-dropdown" id="video-dd">
      <div class="tp-dropdown-title">Video Quality</div>
      <div id="quality-list"><span style="color:#6b6b8a;font-size:12px;padding:4px 8px">Loading…</span></div>
    </div>
    <div class="tp-dropdown" id="audio-dd">
      <div class="tp-dropdown-title">Audio Language</div>
      <div id="audio-list"><span style="color:#6b6b8a;font-size:12px;padding:4px 8px">Loading…</span></div>
    </div>
  </div>
</div>

<script>
const video       = document.getElementById('video');
const playOverlay = document.getElementById('play-overlay');
const bufOverlay  = document.getElementById('buf-overlay');
const bufBar      = document.getElementById('buf-bar');
const bufLabel    = document.getElementById('buf-label');
const bufSublabel = document.getElementById('buf-sublabel');
const errOverlay  = document.getElementById('err-overlay');
const errMsg      = document.getElementById('err-msg');
const errDetail   = document.getElementById('err-detail');

const BUFFER_TARGET = 10;      // seconds needed before auto-play
const BUFFER_TIMEOUT_MS = 25000; // FIX: give up after 25s of no progress

let player = null, currentUrl = null, bufferCheckRaf = null;
let bufferStartTime = null;    // FIX: track when buffering started
let segmentErrorCount = 0;     // FIX: count silent segment errors
const MAX_SEGMENT_ERRORS = 5;  // FIX: show error after too many silent failures

shaka.polyfill.installAll();

function toggleDropdown(openId, closeId) {
  document.getElementById(closeId).classList.remove('open');
  document.getElementById(openId).classList.toggle('open');
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.track-panel-overlay')) {
    document.getElementById('video-dd').classList.remove('open');
    document.getElementById('audio-dd').classList.remove('open');
  }
});

function getSafeMaxBandwidth(tracks) {
  const bws = tracks.map(t => t.bandwidth).filter(Boolean).sort((a, b) => a - b);
  if (bws.length <= 1) return Infinity;
  const secondHighest = bws[bws.length - 2];
  const highest = bws[bws.length - 1];
  if (highest > secondHighest * 3) {
    console.warn(`Inflated bandwidth detected: ${highest} bps vs ${secondHighest} bps. Capping ABR.`);
    return secondHighest;
  }
  return Infinity;
}

// FIX: helper to show fatal error with optional detail line
function showError(msg, detail = '') {
  cancelAnimationFrame(bufferCheckRaf);
  bufOverlay.classList.remove('visible');
  playOverlay.classList.add('hidden');
  errMsg.textContent = msg;
  errDetail.textContent = detail;
  errOverlay.classList.add('visible');
}

async function initPlayer() {
  if (player) { await player.destroy(); player = null; }
  segmentErrorCount = 0; // FIX: reset error counter on new player
  player = new shaka.Player(video);

  player.configure({
    streaming: {
      bufferingGoal: 10,
      rebufferingGoal: 3,
      retryParameters: {
        maxAttempts: 2,
        baseDelay: 300,
        backoffFactor: 1.5,
        timeout: 8000,
      },
      stallEnabled: true,
      stallThreshold: 1,
      stallSkip: 0.5,
      jumpLargeGaps: true,
      smallGapLimit: 1.5,
    },
    abr: {
      enabled: false,
      defaultBandwidthEstimate: 300000,
      bandwidthUpgradeTarget: 0.9,
      bandwidthDowngradeTarget: 0.95,
      restrictions: {
        maxBandwidth: 700000,
      },
    },
    manifest: {
      dash: {
        ignoreMinBufferTime: true,
        ignoreSuggestedPresentationDelay: true,
      }
    }
  });

  player.addEventListener('error', (e) => {
    const detail = e.detail;
    const isNetworkError = detail?.category === shaka.util.Error.Category.NETWORK;

    if (isNetworkError) {
      segmentErrorCount++;
      console.warn(`Segment error #${segmentErrorCount}:`, detail?.code, detail?.data?.[0]);

      // FIX: after too many segment errors, surface the error instead of spinning forever
      if (segmentErrorCount >= MAX_SEGMENT_ERRORS) {
        showError(
          'Stream failed to load.',
          `Too many segment errors (code ${detail?.code ?? '?'}). Check your Cloudflare URL or CORS headers.`
        );
      }
      return;
    }

    // Fatal non-network errors (manifest parse, DRM, media decode)
    console.error('Shaka fatal error', detail);
    showError(
      `Playback error (code ${detail?.code ?? '?'}).`,
      detail?.category === shaka.util.Error.Category.MANIFEST
        ? 'The stream manifest could not be parsed. Check the MPD URL.'
        : 'Try a different quality or retry.'
    );
  });
}

function getBuffered() {
  const buf = video.buffered;
  if (!buf.length) return 0;
  const t = video.currentTime;
  for (let i = 0; i < buf.length; i++) {
    if (t >= buf.start(i) && t <= buf.end(i)) return buf.end(i);
  }
  return buf.end(buf.length - 1);
}

function startBufferWatch() {
  bufferStartTime = Date.now(); // FIX: record start time for timeout
  let lastProgress = Date.now();
  let lastBuffered = 0;

  function check() {
    const buffered = getBuffered();
    const pct = Math.min(100, (buffered / BUFFER_TARGET) * 100);
    bufBar.style.width = pct + '%';
    bufLabel.textContent = `Loading… ${Math.round(pct)}%`;

    // FIX: track progress to detect a true stall vs just slow start
    if (buffered > lastBuffered) {
      lastBuffered = buffered;
      lastProgress = Date.now();
      bufSublabel.textContent = '';
    }

    // FIX: timeout — if no progress for BUFFER_TIMEOUT_MS, show error
    const elapsed = Date.now() - lastProgress;
    if (elapsed > BUFFER_TIMEOUT_MS) {
      showError(
        'Stream timed out.',
        'No data received. The Cloudflare link may be broken, expired, or blocked by CORS.'
      );
      return;
    }

    // FIX: show "slow connection" hint after 8s of no progress
    if (elapsed > 8000) {
      bufSublabel.textContent = 'Slow connection — still trying…';
    }

    if (buffered >= BUFFER_TARGET) {
      bufOverlay.classList.remove('visible');
      video.controls = true;

      const tracks = player.getVariantTracks();
      const safeBw = getSafeMaxBandwidth(tracks);
      player.configure({
        abr: {
          enabled: true,
          restrictions: { maxBandwidth: safeBw !== Infinity ? safeBw : 10000000 },
        }
      });

      video.play().catch(err => {
        console.error('play() rejected:', err?.name, err?.message);
      });
    } else {
      bufferCheckRaf = requestAnimationFrame(check);
    }
  }
  bufferCheckRaf = requestAnimationFrame(check);
}

playOverlay.addEventListener('click', async () => {
  playOverlay.classList.add('hidden');
  bufOverlay.classList.add('visible');
  bufBar.style.width = '0%';
  bufLabel.textContent = 'Loading… 0%';
  bufSublabel.textContent = '';
  segmentErrorCount = 0; // FIX: reset on each play attempt

  // FIX: ensure video is paused so Shaka buffers without trying to play
  video.pause();

  // FIX: wait for tracks — retry up to 20 times (2s) if manifest is still parsing
  let tracks = player.getVariantTracks();
  if (!tracks.length) {
    for (let i = 0; i < 20; i++) {
      await new Promise(r => setTimeout(r, 100));
      tracks = player.getVariantTracks();
      if (tracks.length) break;
    }
  }

  if (tracks.length) {
    const lowest = tracks.reduce((a, b) => a.bandwidth < b.bandwidth ? a : b);
    player.selectVariantTrack(lowest, false);
  } else {
    console.warn('No tracks available after waiting — proceeding anyway');
  }

  startBufferWatch();
});

async function loadVideo(url) {
  currentUrl = url;
  cancelAnimationFrame(bufferCheckRaf);
  errOverlay.classList.remove('visible');
  bufOverlay.classList.remove('visible');
  video.controls = false;
  playOverlay.classList.remove('hidden');
  bufBar.style.width = '0%';
  bufSublabel.textContent = '';

  await initPlayer();

  try {
    await player.load(url);

    // FIX: explicitly pause after load so buffering starts cleanly
    video.pause();

    renderQualityTracks();
    renderAudioTracks();
  } catch (e) {
    console.error('Load error', e);
    // FIX: more specific error messages based on error code
    let msg = `Failed to load stream (code ${e.code ?? '?'}).`;
    let detail = 'The URL may be invalid or expired.';
    if (e.code === 1001 || e.code === 1002 || e.code === 1003) {
      detail = 'Network error — check if the Cloudflare URL is reachable and CORS headers are set.';
    } else if (e.code === 4001 || e.code === 4016) {
      detail = 'Manifest parse error — make sure the URL points to a valid .mpd file.';
    }
    showError(msg, detail);
  }
}

function retryLoad() {
  errOverlay.classList.remove('visible');
  errDetail.textContent = '';
  if (currentUrl) loadVideo(currentUrl);
}

/* ---------- quality / audio tracks ---------- */

function formatBitrate(bps) {
  if (!bps) return '';
  return bps >= 1000000 ? (bps / 1000000).toFixed(1) + 'M' : Math.round(bps / 1000) + 'k';
}
function qualityLabel(t) {
  return t.height ? t.height + 'p' : t.width ? t.width + 'w' : 'Track ' + t.id;
}

function renderQualityTracks() {
  const container = document.getElementById('quality-list');
  container.innerHTML = '';
  const tracks = player.getVariantTracks();
  const seen = new Map();
  for (const t of tracks) {
    const key = t.height || t.width || t.id;
    if (!seen.has(key) || t.bandwidth > seen.get(key).bandwidth) seen.set(key, t);
  }
  const unique = [...seen.values()].sort((a, b) => (b.height || 0) - (a.height || 0));
  if (!unique.length) {
    container.innerHTML = '<span style="color:#6b6b8a;font-size:12px;padding:4px 8px">No tracks</span>';
    return;
  }
  document.getElementById('video-dot').style.display = 'inline-block';

  const autoBtn = document.createElement('button');
  autoBtn.className = 'tp-item active';
  autoBtn.innerHTML = `Auto <span class="tp-badge" style="background:rgba(74,222,128,0.2);color:#4ade80">ABR</span>`;
  autoBtn.onclick = () => {
    const safeBw = getSafeMaxBandwidth(player.getVariantTracks());
    player.configure({
      abr: {
        enabled: true,
        restrictions: { maxBandwidth: safeBw !== Infinity ? safeBw : 10000000 },
      }
    });
    container.querySelectorAll('.tp-item').forEach(b => b.classList.remove('active'));
    autoBtn.classList.add('active');
  };
  container.appendChild(autoBtn);

  const allBws = tracks.map(t => t.bandwidth).filter(Boolean).sort((a,b) => a - b);
  const secondHighest = allBws[allBws.length - 2];
  const highest = allBws[allBws.length - 1];
  const isInflatedPresent = highest > secondHighest * 3;

  unique.forEach(track => {
    const isInflated = isInflatedPresent && track.bandwidth === highest;
    const btn = document.createElement('button');
    const qlbl = qualityLabel(track);
    const blbl = formatBitrate(track.bandwidth);
    btn.className = 'tp-item';
    btn.innerHTML = `${qlbl}${blbl ? `<span class="tp-badge">${blbl}</span>` : ''}${isInflated ? `<span class="tp-badge" style="background:rgba(251,191,36,0.2);color:#fbbf24" title="May stall">⚠</span>` : ''}`;
    btn.onclick = () => {
      player.configure({ abr: { enabled: false, restrictions: { maxBandwidth: Infinity } } });
      const match = player.getVariantTracks().find(t =>
        (t.height || t.width || t.id) === (track.height || track.width || track.id)
      );
      if (match) player.selectVariantTrack(match, true);
      container.querySelectorAll('.tp-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    container.appendChild(btn);
  });
}

const LANG_NAMES = {
  hi: 'Hindi', te: 'Telugu', en: 'English', ta: 'Tamil',
  ka: 'Kannada', ml: 'Malayalam', mr: 'Marathi', bn: 'Bengali', und: 'Default'
};
function langLabel(lang, title) {
  if (title && title !== lang) return title;
  return LANG_NAMES[lang?.toLowerCase()] || lang?.toUpperCase() || 'Track';
}

function renderAudioTracks() {
  const container = document.getElementById('audio-list');
  container.innerHTML = '';
  const tracks = player.getVariantTracks();
  const seen = new Set();
  const langs = [];
  for (const t of tracks) {
    const key = t.language || 'und';
    if (!seen.has(key)) { seen.add(key); langs.push({ language: key, label: t.label || '' }); }
  }
  if (!langs.length) {
    container.innerHTML = '<span style="color:#6b6b8a;font-size:12px;padding:4px 8px">No tracks</span>';
    return;
  }
  document.getElementById('audio-dot').style.display = 'inline-block';

  const active = tracks.find(t => t.active);
  const activeLang = active?.language || langs[0].language;

  langs.forEach(({ language, label }) => {
    const btn = document.createElement('button');
    btn.className = 'tp-item' + (language === activeLang ? ' active' : '');
    btn.textContent = langLabel(language, label);
    btn.onclick = () => {
      document.querySelectorAll('#audio-list .tp-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      player.selectAudioLanguage(language);
    };
    container.appendChild(btn);
  });
}

const params = new URLSearchParams(window.location.search);
const autoUrl = params.get('url');
if (autoUrl) loadVideo(autoUrl.trim());
</script>
</body>
</html>
